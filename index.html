
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اطلاعات دانش‌آموز</title>

<style>
body {
  font-family: Tahoma, Arial, sans-serif;
  background: #f2f6f8;
  color: #182b38;
  margin: 0;
  text-align: center;
}

header {
  background: #244f73;
  color: white;
  padding: 30px 15px;
}

main {
  max-width: 600px;
  margin: 25px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 15px;
  box-shadow: 0 4px 15px #0001;
}

.item {
  background: #dcebf4;
  padding: 14px;
  margin: 12px 0;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <h1>اطلاعات دانش‌آموز</h1>
  <p>دفترچه اطلاعات شخصی</p>
</header>

<main>
  <div class="card">
    <h2>مشخصات دانش‌آموز</h2>

    <div class="item">نام: رضا</div>

    <div class="item">نام خانوادگی: احمدی</div>

    <div class="item">شماره تماس اولیا: ثبت نشده</div>

    <div class="item">شماره تماس دوم: ثبت نشده</div>

  </div>
</main>

</body>
</html>
